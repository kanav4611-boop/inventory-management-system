<!DOCTYPE html>
<html>
<head>
    <title>Stock In</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Stock In</h1>

    <h2>{{ product.name }}</h2>

    <p>Current Stock: {{ product.quantity }}</p>

    <form method="POST">

        <label>Quantity to Add:</label>
        <br>

        <input
            type="number"
            name="quantity"
            min="1"
            required
        >

        <br><br>

        <button type="submit">Add Stock</button>

    </form>

    <br>

    <a href="{{ url_for('products') }}">
        Back to Products
    </a>

</body>
</html>
