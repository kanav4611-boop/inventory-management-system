<!DOCTYPE html>
<html>
<head>
    <title>Edit Product - Inventory System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="navbar">
        <h2>📦 Inventory System</h2>

        <div>
            <a href="{{ url_for('home') }}">Dashboard</a>
            <a href="{{ url_for('products') }}">Products</a>
            <a href="{{ url_for('transactions') }}">Transactions</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </div>

    <div class="form-container">

        <h1>✏️ Edit Product</h1>

        <p>Update the information for this product.</p>

        <br>

        <form method="POST">
            {% if error %}
    <p class="form-error">{{ error }}</p>
{% endif %}

            <label>Product Name</label>
            <input
                type="text"
                name="name"
                maxlength="100"
                value="{{ product.name }}"
                required
            >

            <br>

            <label>Category</label>
            <input
                type="text"
                name="category"
                maxlength="100"
                value="{{ product.category }}"
                required
            >

            <br>

            <label>Price (₹)</label>
            <input
                type="number"
                name="price"
                step="0.01"
                min="0"
                value="{{ product.price }}"
                required
            >

            <br>

            <label>Quantity</label>
            <input
                type="number"
                name="quantity"
                min="0"
                value="{{ product.quantity }}"
                required
            >

            <br>

            <label>Minimum Stock Level</label>
            <input
                type="number"
                name="minimum_stock"
                min="0"
                value="{{ product.minimum_stock }}"
                required
            >

            <br><br>

            <button type="submit">💾 Save Changes</button>

            <a href="{{ url_for('products') }}">
                <button type="button">Cancel</button>
            </a>

        </form>

    </div>

</body>
</html>
